name: React CI

on:
  pull_request:
    branches: [main]
    paths:
      - "front/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./front

      - name: Lint
        run: pnpm lint
        working-directory: ./front

      - name: Test
        run: pnpm test -- --run
        working-directory: ./front

      - name: Build
        run: pnpm build
        working-directory: ./front
