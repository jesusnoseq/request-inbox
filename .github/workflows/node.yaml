name: React CI

on:
  pull_request:
    branches: [main]
    paths:
      - "front/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ./front

      - name: Lint
        run: npm run lint
        working-directory: ./front

      - name: Test
        run: npm test -- --run
        working-directory: ./front

      - name: Build
        run: npm run build
        working-directory: ./front
